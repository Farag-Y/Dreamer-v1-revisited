# Experiment
id: default
seed: 1

# Environment
env: cartpole-swingup-sparse
symbolic_env: false
max_episode_length: 1000
action_repeat: 2 ## Unlike planet, a constant action repeat for the chosen envs.
bit_depth: 5
render: false
imagination_horizon: 15

# Training
episodes: 1000
seed_episodes: 5
collect_interval: 100
batch_size: 50
chunk_size: 50
experience_size: 100000

# Model
embedding_size: 1024
hidden_size: 200 #TODO: Check RSSM for dreamer is also still 200
belief_size: 200
state_size: 30
activation_function: relu
dense_hidden_size: 300  # reward/actor/critic/discount models: 3 dense layers of size 300 per Dreamer paper
dense_activation_function: elu 
lam: 0.95
# Optimisation
learning_rate: 6e-4 #TODO: Revise on learning rate from paper
actor_learning_rate: 8e-5
critic_learning_rate: 8e-5
discount_model_gamma: 0.99
learning_rate_schedule: 0
adam_epsilon: 1e-4
grad_clip_norm: 100

# Overshooting
overshooting_distance: 50
overshooting_kl_beta: 0
overshooting_reward_scale: 0

# Losses
global_kl_beta: 0.0
free_nats: 3.0

# Action noise
action_noise: 0.3

# Hardware
disable_cuda: false

# Evaluation
test: false
test_interval: 25
test_episodes: 10

# Checkpointing
checkpoint_interval: 25
experience_replay_interval: 100  # save experience_replay_{episode}.pt alongside metrics.png every N episodes (0 = disabled)
models: ""
experience_replay_path: ""
# models: "results/vast-ai-first/Checkpoint_150/models.pt"
# experience_replay_path: "results/vast-ai-first/Checkpoint_150/experience_replay.pt"

# Cloud storage (Cloudflare R2)
# Enable with: r2_enabled=true r2_bucket=my-bucket
# Credentials via env vars: CF_R2_ACCOUNT_ID, CF_R2_ACCESS_KEY, CF_R2_SECRET_KEY
r2_enabled: true
r2_bucket: "planet-checkpoints-vastai"
r2_log_path: ""   # path to training log on disk; set to /workspace/training.log on Vast.ai
